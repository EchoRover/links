<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Common free time · linkCS</title>
    <link rel="icon" type="image/webp" href="assets/hacker.webp">
    <script src="js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400;1,500;1,600&family=Familjen+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Rebuilt onto the site's own tokens. The previous pass referenced
           --rule-light and --fg-light, which styles.css does not define, so
           several surfaces fell back to transparent and the page never matched
           the rest of linkCS. */
        .cmn-wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 70px; }

        .cmn-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 34px 0 8px; flex-wrap: wrap; }
        .cmn-title { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: clamp(1.7rem, 4vw, 2.6rem); color: var(--fg); margin: 0; }
        .cmn-title em { color: var(--coral); }
        .cmn-sub { font-size: 0.86rem; color: var(--fg-soft); max-width: 560px; line-height: 1.45; margin: 6px 0 0; }

        .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 22px 0 20px; }
        .person { padding: 11px 15px; border: 1px solid var(--rule); border-radius: 12px; background: var(--bg-card);
                  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); }
        .person h3 { margin: 0; font-family: var(--font-serif); font-style: italic; font-weight: 500; color: var(--fg); font-size: 1.05rem; }
        .person select { background: var(--bg); color: var(--fg); border: 1px solid var(--rule); padding: 5px 9px;
                         border-radius: 7px; font-family: var(--font-mono); font-size: 0.78rem; }
        .meets { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-faint); }

        .grid-wrapper { overflow-x: auto; padding-bottom: 16px; }
        .tt-grid { display: flex; flex-direction: column; gap: 8px; min-width: 900px; }
        .tt-row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: stretch; }
        .day-label { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
                     color: var(--fg-faint); display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; }
        .day-track { position: relative; height: 56px; background: var(--bg-card); border: 1px solid var(--rule-faint);
                     border-radius: 10px; overflow: hidden; }

        .block { position: absolute; top: 4px; bottom: 4px; border-radius: 7px; display: flex; align-items: center;
                 justify-content: center; font-size: 0.7rem; font-family: var(--font-mono); text-align: center;
                 line-height: 1.25; padding: 2px 4px; }
        .block-class { background: var(--bg-elevated); color: var(--fg-soft); z-index: 2; border: 1px solid var(--rule); }
        .block-free { background: var(--cyan-soft); color: var(--cyan); z-index: 1; border: 1px solid var(--cyan);
                      font-weight: 600; }

        .time-header { display: grid; grid-template-columns: 76px 1fr; gap: 10px; margin-bottom: 6px; }
        .time-ticks { position: relative; height: 18px; font-size: 0.66rem; font-family: var(--font-mono); color: var(--fg-faint); }
        .tick { position: absolute; transform: translateX(-50%); }

        .bottom-tools { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 24px; flex-wrap: wrap; }
        .toggle-container { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--bg-card); }
        .toggle-btn { padding: 7px 14px; border: none; background: transparent; color: var(--fg-soft); cursor: pointer;
                      font-family: var(--font-mono); font-size: 0.78rem; }
        .toggle-btn.active { background: var(--coral); color: var(--bg-card); }

        .legend { display: flex; gap: 16px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--fg-faint); flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 7px; }
        .legend-box { width: 12px; height: 12px; border-radius: 3px; }
        .lb-class { background: var(--bg-elevated); border: 1px solid var(--rule); }
        .lb-free { background: var(--cyan-soft); border: 1px solid var(--cyan); }
        .lb-busy { background: var(--bg-card); border: 1px solid var(--rule-faint); }

        .cmn-foot { font-size: 0.78rem; color: var(--fg-faint); line-height: 1.55; margin: 24px 0 0; max-width: 720px; }

        @media (max-width: 768px) {
            .controls { gap: 10px; }
            .person { width: 100%; justify-content: space-between; }
            .tt-grid { min-width: 700px; }
            .tt-row, .time-header { grid-template-columns: 48px 1fr; gap: 6px; }
            .day-label { font-size: 0.66rem; padding-right: 5px; }
            .bottom-tools { flex-direction: column; align-items: stretch; }
            .legend { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">
                    <img src="assets/text.webp" class="text-img" alt="IIT Delhi Abu Dhabi">
                    <img src="assets/circle.webp" class="circle-img" alt="">
                </div>
                <span class="brand-name"><span class="brand-part-link">link</span><span class="brand-part-cs">CS</span></span>
                <span class="brand-meta">common free time</span>
            </div>
            <div class="topbar-utils">
                <a href="rooms.html" class="pill"><span class="pill-name">Rooms</span></a>
                <a href="./" class="pill"><span class="pill-name">← Home</span></a>
                <button class="button" id="theme-toggle" aria-label="Toggle theme">◐</button>
            </div>
        </header>

        <div class="cmn-wrap">
            <section class="cmn-hero">
                <div>
                    <h1 class="cmn-title">Common <em>Free Time</em></h1>
                    <p class="cmn-sub">Where a CSE group and an Energy group are both free at once.
                        Pick a group on each side; the green bands are the overlap.</p>
                </div>
            </section>
            <div class="controls">
                <div class="person">
                    <h3>Computer Science</h3>
                    <select id="cse_group">
                        <option value="1">Group 1</option>
                        <option value="2">Group 2</option>
                    </select>
                </div>
                <span class="meets">meets</span>
                <div class="person">
                    <h3>Energy Eng.</h3>
                    <select id="een_group">
                        <option value="1">Group 1</option>
                        <option value="2">Group 2</option>
                    </select>
                </div>
            </div>
            
            <div class="grid-wrapper">
                <div class="time-header">
                    <div></div>
                    <div class="time-ticks" id="ticks"></div>
                </div>
                <div class="tt-grid" id="grid"></div>
            </div>

            <div class="bottom-tools">
                <div class="toggle-container">
                    <button class="toggle-btn active" id="btn-cse" onclick="setPerspective('cse')">CSE Perspective</button>
                    <button class="toggle-btn" id="btn-een" onclick="setPerspective('een')">Energy Perspective</button>
                </div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-box lb-class"></div> <span id="leg-class">CSE Class</span></div>
                    <div class="legend-item"><div class="legend-box lb-free"></div> Both Free</div>
                    <div class="legend-item"><div class="legend-box lb-busy"></div> <span id="leg-busy">Energy Busy</span></div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/ui.js"></script>
    <script src="js/common.js"></script>
    <script>
        const START_MIN = 8 * 60; // 08:00
        const END_MIN = 19 * 60;  // 19:00
        const TOTAL_MINS = END_MIN - START_MIN;
        let currentPerspective = 'cse';

        const tmin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
        const t12 = (mins) => {
            let h = Math.floor(mins / 60);
            let m = mins % 60;
            return m ? `${h}:${String(m).padStart(2, "0")}` : `${h}:00`; 
        };
        const pos = (m) => ((m - START_MIN) / TOTAL_MINS) * 100;
        const wid = (s, e) => ((e - s) / TOTAL_MINS) * 100;

        const ticksEl = document.getElementById("ticks");
        for (let h = 8; h <= 19; h++) {
            const m = h * 60;
            const el = document.createElement("div");
            el.className = "tick";
            el.style.left = pos(m) + "%";
            el.textContent = h + ":00";
            ticksEl.appendChild(el);
        }

        function getBlocks(data, group, day) {
            const dayData = data[day] || [];
            let blocks = [];
            for (let [s, e, code, g] of dayData) {
                if (g === 0 || g === parseInt(group)) {
                    blocks.push({ s: tmin(s), e: tmin(e), code });
                }
            }
            return blocks.sort((a, b) => a.s - b.s);
        }

        function setPerspective(p) {
            currentPerspective = p;
            document.getElementById("btn-cse").classList.toggle("active", p === 'cse');
            document.getElementById("btn-een").classList.toggle("active", p === 'een');
            document.getElementById("leg-class").textContent = p === 'cse' ? 'CSE Class' : 'Energy Class';
            document.getElementById("leg-busy").textContent = p === 'cse' ? 'Energy Busy' : 'CSE Busy';
            calculate();
        }

        function calculate() {
            const cse_g = document.getElementById("cse_group").value;
            const een_g = document.getElementById("een_group").value;

            const days = {1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri"};
            const gridEl = document.getElementById("grid");
            gridEl.innerHTML = "";

            for (let d = 1; d <= 5; d++) {
                const row = document.createElement("div");
                row.className = "tt-row";
                
                const label = document.createElement("div");
                label.className = "day-label";
                label.textContent = days[d];
                row.appendChild(label);

                const track = document.createElement("div");
                track.className = "day-track";

                const cseBlocks = getBlocks(CSE_WEEK, cse_g, d);
                const eenBlocks = getBlocks(EEN_WEEK, een_g, d);
                
                const baseBlocks = currentPerspective === 'cse' ? cseBlocks : eenBlocks;

                for (let b of baseBlocks) {
                    const block = document.createElement("div");
                    block.className = "block block-class";
                    block.style.left = pos(b.s) + "%";
                    block.style.width = wid(b.s, b.e) + "%";
                    block.innerHTML = `<span>${b.code}</span>`;
                    track.appendChild(block);
                }

                const allBusy = [...cseBlocks, ...eenBlocks].map(b => [b.s, b.e]).sort((a, b) => a[0] - b[0]);
                let mergedBusy = [];
                if (allBusy.length > 0) {
                    let current = [...allBusy[0]];
                    for (let i = 1; i < allBusy.length; i++) {
                        if (allBusy[i][0] <= current[1]) {
                            current[1] = Math.max(current[1], allBusy[i][1]);
                        } else {
                            mergedBusy.push(current);
                            current = [...allBusy[i]];
                        }
                    }
                    mergedBusy.push(current);
                }

                let free = [];
                let last = START_MIN;
                for (let b of mergedBusy) {
                    if (b[0] > last) free.push([last, b[0]]);
                    last = Math.max(last, b[1]);
                }
                if (last < END_MIN) free.push([last, END_MIN]);

                for (let f of free) {
                    if (f[1] - f[0] >= 30) {
                        const block = document.createElement("div");
                        block.className = "block block-free";
                        block.style.left = pos(f[0]) + "%";
                        block.style.width = wid(f[0], f[1]) + "%";
                        block.innerHTML = `<span>Free<br>${t12(f[0])}-${t12(f[1])}</span>`;
                        track.appendChild(block);
                    }
                }

                row.appendChild(track);
                gridEl.appendChild(row);
            }
        }

        document.getElementById("cse_group").addEventListener("change", calculate);
        document.getElementById("een_group").addEventListener("change", calculate);
        calculate();
    </script>
</body>
</html>
