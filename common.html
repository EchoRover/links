<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Common Free Time</title>
    <link rel="icon" type="image/webp" href="assets/hacker.webp">
    <script src="theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400;1,500;1,600&family=Familjen+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .common-container { max-width: 800px; margin: 40px auto; padding: 20px; background: var(--bg); border-radius: 12px; border: 1px solid var(--rule); }
        .controls { display: flex; gap: 20px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
        .person { padding: 15px; border: 1px solid var(--rule); border-radius: 8px; background: var(--rule-light); }
        select { background: var(--bg); color: var(--fg); border: 1px solid var(--rule); padding: 5px; border-radius: 4px; font-family: inherit; }
        h2 { font-family: 'Fraunces', serif; margin-bottom: 20px; text-align: center; color: var(--fg); }
        .day { margin-bottom: 20px; }
        .day h3 { font-family: 'JetBrains Mono', monospace; color: var(--coral); border-bottom: 1px solid var(--rule); padding-bottom: 5px; margin-bottom: 10px; }
        .slot { display: inline-block; background: var(--cyan); color: var(--bg); padding: 5px 10px; border-radius: 4px; margin: 0 10px 10px 0; font-family: 'JetBrains Mono', monospace; font-weight: bold; }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-name">
                <span class="brand-part-link">link</span><span class="brand-part-cs">COMMON</span>
            </span>
        </div>
        <div class="topbar-utils">
            <a href="index.html" class="pill"><span class="pill-name">Home</span></a>
            <button class="button" id="theme-toggle" aria-label="Toggle theme">◐</button>
        </div>
    </header>
    <main class="page">
        <div class="common-container">
            <h2>Find Common Free Time</h2>
            <div class="controls">
                <div class="person">
                    <strong>Person A:</strong>
                    <select id="pA_branch">
                        <option value="CSE">CSE</option>
                        <option value="EEN">EEN</option>
                    </select>
                    <select id="pA_group">
                        <option value="1">G1</option>
                        <option value="2">G2</option>
                    </select>
                </div>
                <div class="person">
                    <strong>Person B:</strong>
                    <select id="pB_branch">
                        <option value="CSE">CSE</option>
                        <option value="EEN">EEN</option>
                    </select>
                    <select id="pB_group">
                        <option value="1">G1</option>
                        <option value="2" selected>G2</option>
                    </select>
                </div>
            </div>
            <div id="results"></div>
        </div>
    </main>
    <script src="ui.js"></script>
    <script src="common.js"></script>
    <script>
        const tmin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
        const t12 = (mins) => {
            let h = Math.floor(mins / 60);
            let m = mins % 60;
            const s = h < 12 ? "am" : "pm";
            let d = h % 12; if (d === 0) d = 12;
            return m ? `${d}:${String(m).padStart(2, "0")}${s}` : `${d}${s}`;
        };

        function getBusy(branch, group, day) {
            const data = branch === "CSE" ? CSE_WEEK : EEN_WEEK;
            const dayData = data[day] || [];
            let busy = [];
            for (let [s, e, code, g] of dayData) {
                if (g === 0 || g === parseInt(group)) {
                    busy.push([tmin(s), tmin(e)]);
                }
            }
            return busy;
        }

        function calculate() {
            const pA_b = document.getElementById("pA_branch").value;
            const pA_g = document.getElementById("pA_group").value;
            const pB_b = document.getElementById("pB_branch").value;
            const pB_g = document.getElementById("pB_group").value;

            const days = {1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday", 5: "Friday"};
            let html = "";
            const START = 8 * 60;
            const END = 19 * 60;

            for (let d = 1; d <= 5; d++) {
                const busyA = getBusy(pA_b, pA_g, d);
                const busyB = getBusy(pB_b, pB_g, d);
                const allBusy = [...busyA, ...busyB].sort((a, b) => a[0] - b[0]);
                
                let mergedBusy = [];
                if (allBusy.length > 0) {
                    let current = allBusy[0];
                    for (let i = 1; i < allBusy.length; i++) {
                        if (allBusy[i][0] <= current[1]) {
                            current[1] = Math.max(current[1], allBusy[i][1]);
                        } else {
                            mergedBusy.push(current);
                            current = allBusy[i];
                        }
                    }
                    mergedBusy.push(current);
                }

                let free = [];
                let last = START;
                for (let b of mergedBusy) {
                    if (b[0] > last) free.push([last, b[0]]);
                    last = Math.max(last, b[1]);
                }
                if (last < END) free.push([last, END]);

                html += `<div class="day"><h3>${days[d]}</h3>`;
                if (free.length === 0) {
                    html += `<span>No common free time.</span>`;
                } else {
                    for (let f of free) {
                        html += `<span class="slot">${t12(f[0])} - ${t12(f[1])}</span>`;
                    }
                }
                html += `</div>`;
            }
            document.getElementById("results").innerHTML = html;
        }

        document.querySelectorAll("select").forEach(el => el.addEventListener("change", calculate));
        calculate();
    </script>
</body>
</html>
