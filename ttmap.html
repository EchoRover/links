<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Timetable Map · linkCS</title>
    <link rel="icon" type="image/webp" href="assets/hacker.webp">
    <script src="js/theme-init.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

    <!--
      THE PREDICTION IS DRAWN ON TOP OF THE SHEET.

      Reviewing a parse as a table of times asks you to hold the grid in
      your head and compare. That is slow and it is the same reading twice.
      Drawn in place, a wrong block is just VISIBLE: the box does not sit on
      the cell, or it swallows the one next to it, or it is the wrong colour
      for its course. You are not checking 34 rows, you are looking at a
      picture that is either right or obviously not.

      Boxes are tinted with the SHEET'S OWN fill colour, read out of the
      PDF, not a palette invented here. That is what makes "same colour =
      same course" mean something.

      NOTHING here has a fixed height or its own scroll container. The page
      scrolls. Two earlier attempts at an app shell broke the wheel.
    -->
    <style>
        body {
            margin: 0;
        }

        .mp-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 9px 14px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--rule);
        }

        .mp-bar select,
        .mp-bar button {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            padding: 5px 9px;
            border: 1px solid var(--rule);
            border-radius: 7px;
            background: var(--bg);
            color: var(--fg);
            cursor: pointer;
        }

        .mp-bar button.on {
            background: var(--coral);
            border-color: var(--coral);
            color: var(--bg-card);
        }

        .mp-bar .sp {
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 0.73rem;
            color: var(--fg-faint);
        }

        /* ---------- course legend ---------- */

        .mp-legend {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 9px 14px;
            border-bottom: 1px solid var(--rule);
        }

        .lg {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            border: 1px solid var(--rule);
            border-radius: 20px;
            padding: 2px 9px 2px 3px;
            cursor: pointer;
            color: var(--fg-soft);
        }

        .lg .sw {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.25);
        }

        .lg.bad {
            border-color: #D97706;
            color: #D97706;
        }

        .lg.dim {
            opacity: 0.32;
        }

        .lg b {
            font-weight: 600;
            color: var(--fg);
        }

        .lg.bad b {
            color: #D97706;
        }

        /* ---------- the page + overlay ---------- */

        .mp-stage {
            position: relative;
            margin: 14px auto 40px;
            width: max-content;
            box-shadow: 0 2px 24px rgba(0, 0, 0, 0.18);
        }

        .mp-stage img {
            display: block;
            /* The sheet is black ink on white. Inverting it in dark mode
               makes every fill colour a lie, and the fills are the course
               code, so it stays white in both themes. */
            background: #fff;
        }

        .mp-layer {
            position: absolute;
            inset: 0;
        }

        .bx {
            position: absolute;
            border: 2px solid rgba(30, 64, 175, 0.75);
            border-radius: 3px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .bx:hover {
            border-color: #1E40AF;
            box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.3);
        }

        /* A block the parser flagged. Amber, and it beats the course tint,
           because "check this" outranks "which course is it". */
        .bx.flag {
            border-color: #D97706;
            border-style: dashed;
        }

        .bx.done {
            border-color: rgba(21, 128, 61, 0.85);
        }

        .bx.sel {
            border-color: #DC2626;
            border-width: 3px;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.28);
        }

        .bx.hide {
            display: none;
        }

        .bx-tag {
            position: absolute;
            top: -1px;
            left: -1px;
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            line-height: 1.35;
            padding: 0 3px;
            background: rgba(255, 255, 255, 0.88);
            color: #111;
            border-radius: 2px 0 3px 0;
            pointer-events: none;
            white-space: nowrap;
        }

        /* what the parser thinks the times are, printed in the box */
        .bx-t {
            position: absolute;
            bottom: -1px;
            right: -1px;
            font-family: var(--font-mono);
            font-size: 9px;
            padding: 0 3px;
            background: rgba(255, 255, 255, 0.88);
            color: #444;
            border-radius: 3px 0 0 2px;
            pointer-events: none;
        }

        .bx.flag .bx-t {
            color: #B45309;
            font-weight: 600;
        }

        /* ---------- regions ---------- */

        .rg {
            position: absolute;
            border: 2px dashed #7C3AED;
            background: rgba(124, 58, 237, 0.09);
            box-sizing: border-box;
        }

        .rg-label {
            position: absolute;
            top: 0;
            left: 0;
            font-family: var(--font-mono);
            font-size: 10px;
            background: #7C3AED;
            color: #fff;
            padding: 1px 5px;
            cursor: pointer;
        }

        .mp-stage.drawing {
            cursor: crosshair;
        }

        .mp-stage.drawing .bx {
            pointer-events: none;
        }

        /* ---------- inspector ---------- */

        .insp {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 30;
            width: 310px;
            background: var(--bg-card);
            border: 1px solid var(--rule);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 8px 34px rgba(0, 0, 0, 0.24);
            font-family: var(--font-mono);
            font-size: 0.76rem;
        }

        .insp[hidden] {
            display: none;
        }

        .insp h3 {
            margin: 0 0 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .insp .g {
            display: grid;
            grid-template-columns: 58px 1fr;
            gap: 5px 7px;
            align-items: center;
        }

        .insp label {
            color: var(--fg-faint);
            font-size: 0.7rem;
        }

        .insp input,
        .insp select {
            width: 100%;
            font: inherit;
            padding: 4px 6px;
            border: 1px solid var(--rule);
            border-radius: 6px;
            background: var(--bg);
            color: var(--fg);
        }

        .insp .why {
            color: #D97706;
            font-size: 0.66rem;
            line-height: 1.4;
            margin: 8px 0 0;
        }

        .insp .raw {
            color: var(--fg-faint);
            font-size: 0.64rem;
            line-height: 1.4;
            margin: 5px 0 0;
            word-break: break-word;
        }

        .insp .acts {
            display: flex;
            gap: 6px;
            margin-top: 9px;
        }

        .insp .acts button {
            flex: 1;
            font: inherit;
            font-size: 0.72rem;
            padding: 5px;
            border: 1px solid var(--rule);
            border-radius: 6px;
            background: var(--bg);
            color: var(--fg);
            cursor: pointer;
        }

        .insp .acts .ok {
            border-color: #15803D;
            color: #15803D;
        }

        .insp .acts .rm {
            border-color: #DC2626;
            color: #DC2626;
        }

        .mp-out {
            padding: 0 14px 40px;
        }

        .mp-out textarea {
            width: 100%;
            height: 190px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            border: 1px solid var(--rule);
            border-radius: 8px;
            background: var(--bg);
            color: var(--fg);
            padding: 9px;
        }

        .mp-out summary {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--fg-faint);
            cursor: pointer;
            padding: 8px 0;
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-name">
                <span class="brand-part-link">link</span><span class="brand-part-cs">CS</span>
            </span>
            <span class="brand-meta">timetable map</span>
        </div>
        <div class="topbar-utils">
            <a href="./" class="pill"><span class="pill-name">← Home</span></a>
            <button class="button" id="theme-toggle" aria-label="Toggle theme">◐</button>
        </div>
    </header>

    <div class="mp-bar">
        <select id="sheet"></select>
        <button id="zoomOut" type="button">−</button>
        <span id="zoomLbl" style="font-family:var(--font-mono);font-size:.73rem">100%</span>
        <button id="zoomIn" type="button">+</button>
        <button id="drawGrid" type="button" title="Drag a box round the week grid">mark grid</button>
        <button id="drawCourses" type="button" title="Drag a box round the course/L-T-P-C table">mark course table</button>
        <button id="hideOk" type="button" title="Show only the blocks the parser flagged">only flagged</button>
        <button id="zero" type="button">groups → 0</button>
        <button id="export" type="button">export WEEK</button>
        <span class="sp" id="count"></span>
    </div>

    <div class="mp-legend" id="legend"></div>

    <div class="mp-stage" id="stage">
        <img id="page" alt="Timetable sheet">
        <div class="mp-layer" id="layer"></div>
    </div>

    <details class="mp-out">
        <summary>JSON in / out</summary>
        <textarea id="out" spellcheck="false"
            placeholder="export WEEK writes here."></textarea>
    </details>

    <aside class="insp" id="insp" hidden></aside>

    <script src="js/ttmap.js" defer></script>
</body>

</html>
